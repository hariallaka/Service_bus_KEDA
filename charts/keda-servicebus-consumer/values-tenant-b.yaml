# Example second tenant APP-5678-UC02 consuming a topic subscription
# (fan-out), deployed side by side with tenant-a to demonstrate isolation.
# KEDA scales on the sub-billing-worker backlog of t-app-5678-uc02-events.
#   helm upgrade --install app-5678-uc02-billing . -f values-tenant-b.yaml

tenant:
  id: APP-5678-UC02

namespace: tenant-app-5678-uc02

serviceAccount:
  name: sb-consumer-sa

identity:
  clientId: "00000000-0000-0000-0000-00000000000b"

serviceBus:
  namespace: sb-example-shared
  entityType: topic
  topicName: t-app-5678-uc02-events
  subscriptionName: sub-billing-worker

scaling:
  messageCount: 10
  minReplicaCount: 0
  maxReplicaCount: 10

workload:
  create: true
  deploymentName: billing-worker
  image: "myregistry.azurecr.io/app-5678/billing-worker:1.0.0"

networkPolicy:
  serviceBusEgressCIDRs:
    - 10.20.4.0/27
